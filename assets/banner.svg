<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for Glow and Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(2deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(12px) rotate(-2deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.08); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      @keyframes nodePulse {
        0%, 100% { r: 5; opacity: 0.6; }
        50% { r: 8; opacity: 1; }
      }
      .floating-card-1 {
        animation: floatSlow 7s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-card-2 {
        animation: floatReverse 8s ease-in-out infinite;
        transform-origin: center;
      }
      .pulse-circle {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .flow-path {
        stroke-dasharray: 8, 8;
        animation: dashMove 3s linear infinite;
      }
      .pulsing-node {
        animation: nodePulse 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />
  <rect width="1196" height="396" x="2" y="2" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.3" rx="14" />

  <!-- Background Animated Glow Spheres -->
  <circle cx="220" cy="130" r="160" fill="url(#glowGrad)" class="pulse-circle" />
  <circle cx="980" cy="270" r="180" fill="url(#glowGrad)" class="pulse-circle" style="animation-delay: -3s;" />

  <!-- Ambient Grid Patterns -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.18">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="850" y1="0" x2="850" y2="400" />
    <line x1="1050" y1="0" x2="1050" y2="400" />
  </g>

  <!-- Multi-Agent Flow Network (Behind Titles in Lower/Side Regions) -->
  <g fill="none" stroke-width="1.8">
    <path d="M 100 320 C 250 350, 400 330, 600 350 C 800 370, 950 330, 1100 340" stroke="#38bdf8" stroke-opacity="0.5" class="flow-path" />
    <path d="M 120 70 C 280 40, 480 80, 680 50 C 880 20, 1000 60, 1120 40" stroke="#c084fc" stroke-opacity="0.4" class="flow-path" style="animation-direction: reverse;" />
  </g>

  <!-- Dynamic Side Badges / Pills (Placed on sides away from center text) -->
  <g class="floating-card-1" filter="url(#cardShadow)">
    <rect x="50" y="190" width="170" height="44" rx="22" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="74" cy="212" r="7" fill="#10b981" class="pulsing-node" />
    <text x="92" y="217" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Agent Swarm Active</text>
  </g>

  <g class="floating-card-2" filter="url(#cardShadow)">
    <rect x="970" y="180" width="180" height="44" rx="22" fill="#1e293b" fill-opacity="0.85" stroke="#c084fc" stroke-width="1.2" />
    <circle cx="994" cy="202" r="7" fill="#818cf8" class="pulsing-node" style="animation-delay: -1.5s;" />
    <text x="1012" y="207" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Autonomous Loops</text>
  </g>

  <!-- Central Foreground Content (Title and Subtitle permanently clear and unobstructed) -->
  <g text-anchor="middle">
    <!-- Top Category Badge -->
    <g transform="translate(600, 75)">
      <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="url(#accentGrad)" stroke-width="1.2" />
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">THE DEFINITIVE CURATED DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="900" fill="url(#textGrad)" filter="url(#glow)" letter-spacing="-0.5">
      Awesome Autonomous AI Agents
    </text>

    <!-- Subtitle (Clear in foreground) -->
    <text x="600" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#f1f5f9">
      Enterprise SaaS Platforms &#x1F3E2; &#x2022; Multi-Agent Orchestration &#x1F465; &#x2022; Open-Source Runtimes &#x26A1;
    </text>

    <!-- Tagline and Highlights -->
    <text x="600" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
      Role-Based Crews &#x2022; Persistent State Graphs &#x2022; Self-Hosted Runtimes &#x2022; Autonomous Code &amp; Web Execution
    </text>

    <!-- Bottom Feature Chips -->
    <g transform="translate(600, 305)">
      <rect x="-250" y="-14" width="110" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <text x="-195" y="4" font-family="sans-serif" font-size="11" font-weight="600" fill="#7dd3fc">&#x1F916; AutoGPT</text>

      <rect x="-125" y="-14" width="115" height="28" rx="14" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1" />
      <text x="-68" y="4" font-family="sans-serif" font-size="11" font-weight="600" fill="#a5b4fc">&#x1F310; Browser Use</text>

      <rect x="5" y="-14" width="115" height="28" rx="14" fill="#0f172a" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1" />
      <text x="62" y="4" font-family="sans-serif" font-size="11" font-weight="600" fill="#e9d5ff">&#x1F4BB; OpenHands</text>

      <rect x="135" y="-14" width="115" height="28" rx="14" fill="#0f172a" stroke="#f472b6" stroke-opacity="0.4" stroke-width="1" />
      <text x="192" y="4" font-family="sans-serif" font-size="11" font-weight="600" fill="#fbcfe8">&#x1F578;&#xFE0F; LangGraph</text>
    </g>
  </g>
</svg>
